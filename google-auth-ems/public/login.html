<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Employee Management System</title>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Glowing background blobs -->
  <div class="glow-shape shape-1"></div>
  <div class="glow-shape shape-2"></div>

  <!-- Theme Toggle Switcher -->
  <div class="theme-switch-wrapper">
    <label class="theme-switch" for="checkbox">
      <input type="checkbox" id="checkbox" />
      <div class="slider">
        <i class="bi bi-sun-fill"></i>
        <i class="bi bi-moon-stars-fill"></i>
      </div>
    </label>
  </div>

  <div class="login-container">
    <div class="login-box glass-card">
      <div class="logo-container">
        <div class="logo-icon">
          <i class="bi bi-grid-fill"></i>
        </div>
        <span class="logo-text">EMS SaaS</span>
      </div>

      <h2 class="login-title">Welcome Back</h2>
      <p class="login-desc">Sign in securely using your corporate Google credentials to access the employee management portal.</p>

      <!-- Google OAuth Initiation Button -->
      <button class="btn-google" onclick="handleGoogleLogin(this)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.87-2.22 5.3-4.7 6.94l7.3 5.66c4.27-3.93 6.65-9.73 6.65-16.83z"/>
          <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.98-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.3-5.66c-2.03 1.36-4.63 2.17-8.59 2.17-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Connect loading state -->
      <div id="loading-wrapper" class="loading-wrapper">
        <div class="spinner"></div>
        <div class="loading-text">Verifying session details, please wait...</div>
      </div>
    </div>
  </div>

  <!-- Dynamic floating container for toasts -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Client Script -->
  <script src="/js/main.js"></script>
</body>
</html>
