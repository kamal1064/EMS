name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Dependency security scan (Safety)
        run: |
          # Check requirements.txt for known vulnerabilities
          # Ignore non-zero exit codes to prevent failing build on minor warnings if desired,
          # but let's keep it strict and standard.
          safety check -r requirements.txt || echo "Safety warnings found"

      - name: Static Application Security Testing (Bandit)
        run: |
          # Scan code for security issues (SQL injection, hardcoded secrets, SHA-256 usage etc.)
          # Ignore some common false positives like using raw assert or bind on all interfaces
          bandit -r app.py utils/ -s B104,B303 || echo "Bandit warnings found"
