<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Error" }} — Employee Management System</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com" nonce="{{ csp_nonce() }}"></script>
  <script nonce="{{ csp_nonce() }}">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          },
          colors: {
            primary: '#3b82f6',
            danger: '#f43f5e',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(244, 63, 94, 0.05), transparent 40%),
                  #0b0f19;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-slate-100 selection:bg-primary/30 selection:text-white">

  <div class="w-full max-w-lg text-center space-y-8 animate-fade-in">
    <!-- Icon & Status Code -->
    <div class="relative inline-flex items-center justify-center">
      <div class="absolute inset-0 bg-primary/20 rounded-full blur-3xl w-48 h-48 mx-auto -z-10"></div>
      <div class="text-[120px] font-black font-outfit tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-primary to-blue-500 leading-none">
        {{ code or 500 }}
      </div>
    </div>

    <!-- Error Details Card -->
    <div class="bg-[#151b2c]/80 backdrop-blur-xl border border-white/5 p-8 md:p-10 rounded-3xl shadow-2xl space-y-6">
      <h1 class="text-2xl font-bold font-outfit text-white tracking-tight">
        {{ title or "An Error Occurred" }}
      </h1>
      
      <p class="text-slate-400 text-base leading-relaxed max-w-md mx-auto">
        {{ message or "An unexpected issue has occurred. The administration team has been notified." }}
      </p>

      <!-- Action Buttons -->
      <div class="pt-4 flex flex-col sm:flex-row gap-4 justify-center items-center">
        <a href="/dashboard" class="w-full sm:w-auto px-6 py-3 bg-gradient-to-r from-primary to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-medium rounded-xl transition-all shadow-lg shadow-primary/25 hover:shadow-primary/35 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Go to Dashboard
        </a>
        <button onclick="window.history.back()" class="w-full sm:w-auto px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white font-medium rounded-xl transition-all flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Go Back
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-slate-600 text-xs font-mono tracking-wider uppercase">
      Employee Management System &copy; 2026
    </div>
  </div>

</body>
</html>
