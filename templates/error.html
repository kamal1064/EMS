<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Error" }} — WorkNest EMS</title>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --card:      #ffffff;
      --card-border: #e5e7eb;
      --text:      #1a1a1a;
      --text2:     #6b7280;
      --text3:     #9ca3af;
      --primary:   #4f46e5;
      --primary-lo:rgba(79,70,229,0.08);
      --danger:    #ef4444;
      --danger-lo: rgba(239,68,68,0.08);
      --radius:    8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #09090b;
        --card:       #18181b;
        --card-border:#27272a;
        --text:       #fafafa;
        --text2:      #a1a1aa;
        --text3:      #71717a;
        --primary:    #6366f1;
        --primary-lo: rgba(99,102,241,0.15);
        --danger-lo:  rgba(239,68,68,0.15);
      }
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .error-wrapper {
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Brand */
    .error-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    .error-brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }
    .error-brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    /* Code */
    .error-code {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--primary);
    }

    /* Card */
    .error-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .error-icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--danger-lo);
      border: 1px solid rgba(239,68,68,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--danger);
      margin: 0 auto 4px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .error-message {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.65;
    }

    /* Buttons */
    .error-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--text3); background: var(--primary-lo); }

    /* Footer */
    .error-footer {
      font-size: 11px;
      color: var(--text3);
      font-family: monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="error-wrapper">

    <!-- Brand -->
    <div class="error-brand">
      <div class="error-brand-icon"><i class="bi bi-people-fill"></i></div>
      <span class="error-brand-name">WorkNest EMS</span>
    </div>

    <!-- Code -->
    <div class="error-code">{{ code or 500 }}</div>

    <!-- Card -->
    <div class="error-card">
      <div class="error-icon-wrap">
        <i class="bi bi-exclamation-triangle"></i>
      </div>
      <div class="error-title">{{ title or "An Error Occurred" }}</div>
      <div class="error-message">
        {{ message or "An unexpected issue has occurred. Please try again or return to the dashboard." }}
      </div>
      <div class="error-actions">
        <a href="/dashboard" class="btn-primary">
          <i class="bi bi-house"></i> Go to Dashboard
        </a>
        <button onclick="window.history.back()" class="btn-secondary">
          <i class="bi bi-arrow-left"></i> Go Back
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="error-footer">WorkNest EMS &copy; 2026</div>

  </div>

</body>
</html>
